name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: password
          POSTGRES_DB: knowledgehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+asyncpg://runner:password@localhost:5432/knowledgehub"
      MIGRATION_DATABASE_URL: "postgresql+asyncpg://runner:password@localhost:5432/knowledgehub"
      SUPABASE_URL: "http://dummy.supabase.co"
      SUPABASE_KEY: "dummy"
      SUPABASE_SERVICE_ROLE_KEY: "dummy"
      SUPABASE_JWT_SECRET: "dummy_jwt_secret_must_be_long_enough_for_hs256_alg"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
      PYTHONPATH: "backend"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Initialize Supabase Roles
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U runner -d knowledgehub -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon; END IF; IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role; END IF; END \$\$;"
      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run pytest
        run: pytest backend/tests/

  frontend-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "http://dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run lint
        working-directory: frontend
        run: npm run lint
      - name: Run build
        working-directory: frontend
        run: npm run build

  docker-validation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
      MIGRATION_DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
      SUPABASE_URL: "http://dummy.supabase.co"
      SUPABASE_KEY: "dummy"
      SUPABASE_SERVICE_ROLE_KEY: "dummy"
      SUPABASE_JWT_SECRET: "dummy_jwt_secret"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker compose build backend
      - name: Build Frontend Docker Image
        run: docker compose build frontend
