name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
      MIGRATION_DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
      SUPABASE_URL: "http://dummy.supabase.co"
      SUPABASE_KEY: "dummy"
      SUPABASE_SERVICE_ROLE_KEY: "dummy"
      SUPABASE_JWT_SECRET: "dummy_jwt_secret_must_be_long_enough_for_hs256_alg"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
      PYTHONPATH: "backend"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run pytest
        run: pytest backend/tests/

  frontend-build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "http://dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run lint
        working-directory: frontend
        run: npm run lint
      - name: Run build
        working-directory: frontend
        run: npm run build

  docker-validation:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
      MIGRATION_DATABASE_URL: "postgresql+asyncpg://dummy:dummy@localhost/dummy"
      SUPABASE_URL: "http://dummy.supabase.co"
      SUPABASE_KEY: "dummy"
      SUPABASE_SERVICE_ROLE_KEY: "dummy"
      SUPABASE_JWT_SECRET: "dummy_jwt_secret"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker compose build backend
      - name: Build Frontend Docker Image
        run: docker compose build frontend
